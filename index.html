<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07030f">
<title>Happy Diwali 🪔</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🪔%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --night:#07030f; --plum:#1b0a33; --gold:#ffd27a; --amber:#ffa733; --flame:#ff6a1a; --rose:#ff4d6d; --ink:#fff1de;
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --sans:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--night);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body{overflow-x:hidden}
#root{min-height:100svh}
.root{position:relative;min-height:100svh;overflow-x:hidden;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}

/* background layers */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 110%,#2a0f4a 0%,#12062a 45%,var(--night) 80%)}
.bg.warm{opacity:0;transition:opacity 3s ease;
  background:radial-gradient(ellipse at 50% 100%,rgba(255,120,30,.38) 0%,rgba(190,50,90,.22) 35%,rgba(40,10,70,0) 70%)}
.igniting .bg.warm,.show .bg.warm{opacity:1;animation:breathe 7s ease-in-out infinite alternate 3s}
@keyframes breathe{from{opacity:.75}to{opacity:1}}

.sky{position:fixed;inset:0;z-index:2;pointer-events:none}

.rangoli{position:fixed;left:50%;top:50%;width:min(135vmax,1000px);height:min(135vmax,1000px);translate:-50% -50%;
  z-index:1;pointer-events:none;color:var(--gold);opacity:0;transition:opacity 4s ease 1.2s}
.show .rangoli,.igniting .rangoli{opacity:.12}
.rangoli .spin{transform-origin:0 0;transform-box:view-box;animation:spin 140s linear infinite}
.rangoli .spin.b{animation-duration:200s;animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}

/* lanterns */
.lanterns{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden;opacity:0;transition:opacity 3s ease 1.5s}
.show .lanterns{opacity:1}
.lantern{position:absolute;bottom:-120px;left:var(--x);width:var(--w);height:calc(var(--w)*1.28);
  border-radius:42% 42% 48% 48%/30% 30% 62% 62%;
  background:radial-gradient(circle at 50% 72%,#fff6c4 0%,#ffb13d 38%,#e0561c 78%,#a82f10 100%);
  box-shadow:0 0 28px 8px rgba(255,140,40,.4),0 0 90px 20px rgba(255,100,30,.18);
  opacity:0;animation:rise var(--d) linear var(--dl) infinite}
.lantern::after{content:"";position:absolute;left:25%;right:25%;bottom:-5px;height:7px;border-radius:0 0 8px 8px;background:#7a2a0a}
@keyframes rise{
  0%{transform:translate3d(0,0,0) rotate(-4deg);opacity:0}
  8%{opacity:.9}
  50%{transform:translate3d(var(--dx),-62vh,0) rotate(4deg)}
  100%{transform:translate3d(calc(var(--dx) * -.7),-135vh,0) rotate(-4deg);opacity:0}}

/* diya */
.diya{position:relative;display:block}
.diya svg{width:100%;height:auto;display:block;overflow:visible;position:relative}
.dglow{position:absolute;left:-60%;right:-60%;top:-70%;height:200%;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(255,170,60,.5) 0%,rgba(255,120,30,.2) 30%,transparent 62%);opacity:0;transition:opacity 1s}
.diya.lit .dglow{opacity:1;animation:glowp 2.6s ease-in-out infinite}
@keyframes glowp{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.12);opacity:1}}
.flame{opacity:0;transform-box:fill-box;transform-origin:50% 100%;transform:scale(0)}
.diya.lit .flame{animation:ignite 1s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes ignite{0%{opacity:0;transform:scale(0)}40%{opacity:1;transform:scale(1.25,1.4)}100%{opacity:1;transform:scale(1)}}
.flick{transform-box:fill-box;transform-origin:50% 100%;animation:flick 1.6s ease-in-out infinite alternate}
@keyframes flick{
  0%{transform:scale(1,1) skewX(0)}
  25%{transform:scale(.94,1.07) skewX(2.5deg)}
  50%{transform:scale(1.04,.96) skewX(-2deg)}
  75%{transform:scale(.97,1.05) skewX(1.5deg)}
  100%{transform:scale(1.02,1) skewX(-3deg)}}

/* intro */
.intro{position:fixed;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  transition:opacity 1.2s ease,transform 1.2s ease}
.intro .diya{animation:floaty 4s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.hint{margin-top:26px;font-family:var(--serif);font-size:clamp(22px,4vw,30px);letter-spacing:.04em;color:var(--gold);
  animation:pulse 2.4s ease-in-out infinite;text-shadow:0 0 18px rgba(255,170,60,.5)}
.sub{font-size:13px;font-weight:300;letter-spacing:.12em;opacity:.55;text-transform:uppercase}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
.ring{position:absolute;left:50%;top:50%;width:80px;height:80px;margin:-60px 0 0 -40px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(255,200,110,.9),rgba(255,120,30,.4) 40%,transparent 70%);opacity:0;transform:scale(0)}
.igniting .ring{animation:ringout 1.8s ease-out forwards}
@keyframes ringout{0%{opacity:.95;transform:scale(0)}100%{opacity:0;transform:scale(26)}}
.igniting .hint,.igniting .sub,.show .hint,.show .sub{opacity:0;animation:none;transition:opacity .6s}
.igniting .intro{pointer-events:none}
.show .intro{opacity:0;transform:scale(1.15);pointer-events:none}
.idle .hint{animation:pulse 2.4s ease-in-out infinite}

/* content */
.content{position:relative;z-index:3;min-height:100svh;display:flex;flex-direction:column;align-items:center;
  padding:clamp(28px,6vh,64px) 18px 36px;text-align:center;cursor:default}
h1{font-family:var(--serif);font-weight:700;font-size:clamp(46px,11vw,112px);line-height:1;letter-spacing:.01em;color:#ffe3a8;
  text-shadow:0 0 22px rgba(255,150,40,.75),0 0 60px rgba(255,90,30,.45);animation:titleglow 4s ease-in-out infinite alternate 2s}
@keyframes titleglow{from{text-shadow:0 0 18px rgba(255,150,40,.6),0 0 44px rgba(255,90,30,.3)}
  to{text-shadow:0 0 30px rgba(255,190,80,.95),0 0 90px rgba(255,90,30,.6)}}
.l{display:inline-block;opacity:0;animation:letter 1.2s cubic-bezier(.2,.9,.2,1) forwards}
@keyframes letter{0%{opacity:0;transform:translateY(40px) scale(.6) rotate(-6deg);filter:blur(14px)}
  60%{opacity:1;filter:blur(0)}100%{opacity:1;transform:none;filter:blur(0)}}
.emo{font-size:clamp(26px,5vw,38px);margin-top:10px;letter-spacing:.3em;opacity:0;animation:fade 1s ease 1.4s forwards}
.lang{margin-top:8px;font-size:clamp(14px,2.4vw,17px);font-weight:300;letter-spacing:.08em;color:var(--gold);opacity:0;animation:fade 1.2s ease 1.7s forwards}
@keyframes fade{to{opacity:.9}}

.row{display:flex;align-items:flex-end;justify-content:center;gap:clamp(2px,2.4vw,26px);margin:clamp(16px,3vh,30px) 0 clamp(14px,3vh,28px);min-height:96px}
.slot{display:flex;justify-content:center;opacity:0;animation:slotin .9s cubic-bezier(.2,.9,.2,1) forwards}
.s2{animation-delay:.9s}.s1{animation-delay:1.1s}.s3{animation-delay:1.1s}.s0{animation-delay:1.3s}.s4{animation-delay:1.3s}
@keyframes slotin{from{opacity:0;transform:translateY(24px) scale(.85)}to{opacity:1;transform:none}}
.slot .diya{margin:0 -4px;width:min(87px,17vw)!important}
.s2 .diya{width:min(117px,24vw)!important}

.card{width:min(100%,720px);padding:clamp(22px,4vw,40px) clamp(20px,4vw,44px);border-radius:28px;
  background:linear-gradient(160deg,rgba(40,14,66,.55),rgba(22,8,40,.5));
  border:1px solid rgba(255,196,110,.28);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 0 0 1px rgba(255,255,255,.03) inset,0 24px 80px rgba(0,0,0,.45),0 0 70px rgba(255,130,40,.14);
  opacity:0;animation:cardin 1.4s ease 1.6s forwards}
@keyframes cardin{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
.para{font-size:clamp(15.5px,2.5vw,19px);font-weight:300;line-height:1.85;color:var(--ink)}
.para+.para{margin-top:1.1em}
.w{display:inline-block;opacity:0;animation:word .8s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes word{from{opacity:0;transform:translateY(10px);filter:blur(7px)}to{opacity:1;transform:none;filter:blur(0)}}
.closing{margin-top:1.6em;padding-top:1.4em;border-top:1px solid rgba(255,196,110,.22);
  font-family:var(--serif);font-weight:700;font-size:clamp(22px,4.2vw,32px);line-height:1.35;color:var(--gold);
  text-shadow:0 0 22px rgba(255,150,40,.5);animation:sheen 3s ease-in-out infinite alternate;animation-delay:inherit}
.closing .inline{display:inline}
.heart{display:inline-block;margin-left:.2em;opacity:0;animation:heartin .8s ease forwards,beat 1.3s ease-in-out infinite 1.2s;animation-delay:inherit}
@keyframes heartin{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}
@keyframes beat{0%,100%{transform:scale(1)}14%{transform:scale(1.28)}28%{transform:scale(1)}42%{transform:scale(1.2)}70%{transform:scale(1)}}
@keyframes sheen{from{text-shadow:0 0 14px rgba(255,150,40,.35)}to{text-shadow:0 0 30px rgba(255,190,80,.8)}}

.actions{margin-top:26px;display:flex;gap:12px;flex-wrap:wrap;justify-content:center;opacity:0;animation:fade 1s ease forwards}
button{font:inherit;color:var(--ink);cursor:pointer}
.actions button{padding:11px 22px;border-radius:999px;font-size:14px;font-weight:400;letter-spacing:.04em;
  background:rgba(255,190,100,.1);border:1px solid rgba(255,196,110,.4);transition:transform .2s,background .2s,box-shadow .2s}
.actions button:hover{background:rgba(255,190,100,.22);box-shadow:0 0 24px rgba(255,150,40,.35);transform:translateY(-2px)}
.actions button:active{transform:scale(.96)}
.tip{margin-top:16px;font-size:12px;font-weight:300;letter-spacing:.16em;text-transform:uppercase;opacity:0;animation:fade 1s ease forwards;color:var(--gold)}
.tip{animation-name:fadelow}
@keyframes fadelow{to{opacity:.55}}

.mute{position:fixed;top:max(14px,env(safe-area-inset-top));right:14px;z-index:10;width:42px;height:42px;border-radius:50%;
  display:grid;place-items:center;background:rgba(20,8,36,.55);border:1px solid rgba(255,196,110,.35);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:var(--gold);transition:transform .2s,box-shadow .2s}
.mute:hover{box-shadow:0 0 20px rgba(255,150,40,.4);transform:scale(1.07)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

@media (prefers-reduced-motion:reduce){
  .lantern,.rangoli .spin,.flick,.intro .diya,.bg.warm{animation:none!important}
  .w,.l{animation-duration:.01s!important;animation-delay:0s!important}
}
</style>
</head>
